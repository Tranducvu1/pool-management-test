services:
  - type: web
    name: pool-management-demo
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter pool-management-backend exec prisma generate --schema prisma/schema.postgresql.prisma && pnpm --filter pool-management-frontend build
    startCommand: pnpm --filter pool-management-backend db:deploy && pnpm --filter pool-management-backend db:bootstrap && pnpm --filter pool-management-backend start
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORE_UPLOADS_IN_DB
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: "postgresql://pool_management_db_user:Gj7U7vfS9akAR9HDg6qIP0N7z6MYZDoP@dpg-daid961594qs7389b39g-a.oregon-postgres.render.com:5432/pool_management_db"

databases:
  - name: pool-management-db
    plan: free
